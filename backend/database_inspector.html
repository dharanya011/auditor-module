<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live PostgreSQL Database Inspector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #F4F6FB;
            --bg-card: #FFFFFF;
            --border-color: #E2E8F0;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --accent-primary: #4F46E5;
            --accent-light: #EEF2FF;
            --accent-hover: #4338CA;
            --active-bg: #E0E7FF;
            --active-text: #3730A3;
            --table-header-bg: #F8FAFC;
            --green-dot: #10B981;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --radius-lg: 12px;
            --radius-md: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header */
        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .db-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);
            color: var(--accent-primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #C7D2FE;
        }

        .header-title-group {
            display: flex;
            flex-direction: column;
        }

        .title-line {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0F172A;
        }

        .live-badge {
            background-color: #ECFDF5;
            color: #047857;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid #A7F3D0;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: var(--green-dot);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .header-sub {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .btn-refresh {
            background-color: var(--accent-primary);
            color: #FFFFFF;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover {
            background-color: var(--accent-hover);
        }

        /* Layout */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 16px 20px;
            gap: 16px;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .sidebar-search {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.82rem;
            font-family: inherit;
            outline: none;
            background-color: #FAFAFD;
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            background-color: #FFFFFF;
        }

        .sidebar-header {
            padding: 10px 14px 6px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .count-badge {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-primary);
            background-color: var(--accent-light);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .tables-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .table-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.15s ease;
            border: none;
            background: transparent;
            text-align: left;
            width: 100%;
        }

        .table-btn:hover {
            background-color: #F1F5F9;
            color: var(--text-primary);
        }

        .table-btn.active {
            background-color: var(--active-bg);
            color: var(--active-text);
            font-weight: 700;
        }

        .table-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .row-badge {
            font-size: 0.7rem;
            font-weight: 600;
            background-color: #E2E8F0;
            color: #475569;
            padding: 1px 6px;
            border-radius: 8px;
            min-width: 24px;
            text-align: center;
        }

        .table-btn.active .row-badge {
            background-color: var(--accent-primary);
            color: #FFFFFF;
        }

        /* Content Panel */
        .content-panel {
            flex: 1;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .toolbar {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0F172A;
            font-family: 'JetBrains Mono', monospace;
        }

        .meta-pill {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            background-color: #F1F5F9;
            color: #475569;
            margin-left: 8px;
        }

        /* Table View */
        .table-container {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        table.data-grid {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            text-align: left;
        }

        table.data-grid th {
            position: sticky;
            top: 0;
            background-color: var(--table-header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 14px;
            font-weight: 700;
            color: #334155;
            white-space: nowrap;
            z-index: 5;
        }

        table.data-grid td {
            padding: 10px 14px;
            border-bottom: 1px solid #F1F5F9;
            color: #334155;
            white-space: nowrap;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        table.data-grid tbody tr:hover {
            background-color: #F8FAFC;
        }

        .btn-inspect {
            background-color: #EEF2FF;
            color: var(--accent-primary);
            border: 1px solid #C7D2FE;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-inspect:hover {
            background-color: var(--accent-primary);
            color: #FFFFFF;
        }

        .footer-status {
            padding: 10px 18px;
            border-top: 1px solid var(--border-color);
            background-color: #FAFAFD;
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: space-between;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal.active { display: flex; }

        .modal-box {
            background: #FFF;
            border-radius: var(--radius-lg);
            width: 550px;
            max-width: 90vw;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-head {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .modal-body {
            padding: 16px;
            overflow-y: auto;
            background: #0F172A;
            color: #38BDF8;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            flex: 1;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <div class="db-icon">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M4 6c0 1.657 3.582 3 8 3s8-1.343 8-3-3.582-3-8-3-3.582 3-8 3zM4 6v6c0 1.657 3.582 3 8 3s8-1.343 8-3V6m0 6v6c0 1.657 3.582 3 8 3s8-1.343 8-3v-6"/>
                </svg>
            </div>
            <div class="header-title-group">
                <div class="title-line">
                    <h1 class="header-title">Live PostgreSQL Database Inspector</h1>
                    <span class="live-badge"><span class="pulse-dot"></span> LIVE DB</span>
                </div>
                <span class="header-sub">Inspect tables, schemas, and live records from AWS PostgreSQL</span>
            </div>
        </div>
        <button class="btn-refresh" id="btnRefresh" onclick="loadAllData()">
            Refresh Data
        </button>
    </header>

    <!-- Main Workspace -->
    <div class="main-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-search">
                <input type="text" id="tableFilter" class="search-input" placeholder="Search tables..." oninput="renderSidebar()">
            </div>
            <div class="sidebar-header">
                <span class="sidebar-label">POSTGRESQL TABLES</span>
                <span class="count-badge" id="tableCountBadge">0 TABLES</span>
            </div>
            <div class="tables-list" id="tablesList"></div>
        </aside>

        <!-- Data Content -->
        <main class="content-panel">
            <div class="toolbar">
                <div>
                    <span class="table-title" id="activeTableName">Select a table</span>
                    <span class="meta-pill" id="rowCountPill">0 Rows</span>
                    <span class="meta-pill" id="colCountPill">0 Cols</span>
                </div>
                <div style="width: 240px;">
                    <input type="text" id="rowSearch" class="search-input" placeholder="Filter rows..." oninput="renderTableBody()">
                </div>
            </div>

            <div class="table-container">
                <table class="data-grid">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="footer-status">
                <span id="statusMessage">Connecting to live PostgreSQL database...</span>
                <span>AWS PostgreSQL Engine</span>
            </div>
        </main>
    </div>

    <!-- JSON Modal -->
    <div class="modal" id="jsonModal">
        <div class="modal-box">
            <div class="modal-head">
                <span id="modalTitle">Record Detail</span>
                <button onclick="closeModal()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;">&times;</button>
            </div>
            <div class="modal-body">
                <pre id="modalJson"></pre>
            </div>
        </div>
    </div>

    <script src="database_inspector.js"></script>
</body>
</html>
